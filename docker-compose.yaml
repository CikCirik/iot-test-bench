# Banc de test, un singur nod, fara Swarm - fiecare serviciu IoT e activat
# printr-un profil Compose (vezi .env pentru lista si comentarii). Porneste
# doar ce ai nevoie cu: docker compose --profile nodered --profile chirpstack up -d
# (sau foloseste ./up.sh, generat mai jos, care citeste .env si construieste
# automat lista de --profile din INSTALL_*=true/false).
#
# Traefik NU are profil - porneste mereu cu "docker compose up", indiferent
# ce profile alegi (e reverse proxy-ul comun pentru tot ce activezi).
#
# Coolify NU e in acest fisier - e o instalare OFICIALA separata (scriptul
# lor: curl -fsSL https://cdn.coollabs.io/coolify/install.sh | sudo bash),
# gestionata prin propriul UI web, nu prin acest docker-compose.yaml. Traefik-ul
# de mai jos are doar o RUTA catre ea (traefik/coolify.yml) - vezi README.md.
#
# Rutele Traefik catre serviciile IoT NU sunt etichete Docker pe servicii -
# sunt randate din traefik/routes.tmpl.yml (provider "file", vezi
# traefik/entrypoint.sh). Motiv: cand acest proiect e deployat prin Coolify
# (Git), Coolify dubleaza "$" in orice ${VAR} gasit intr-un bloc "labels:",
# stricand interpolarea - indiferent de site (etaj/cladire), CLUSTER_DOMAIN
# se schimba doar din Environment Variables (Coolify) sau .env (local), fara
# sa mai atingi acest fisier. Traefik nu mai are nevoie de docker.sock.

networks:
  iot:
    driver: bridge

volumes:
  mosquitto-config:
  mosquitto-data:
  mosquitto-log:
  nodered-data:
  zigbee2mqtt-data:
  chirpstack-postgres-data:
  chirpstack-redis-data:
  chirpstack-gwbridge-config:
  chirpstack-config:
  traefik-certs:
  traefik-dynamic:

services:

  # -------------------- MOSQUITTO (MQTT) --------------------
  mosquitto:
    image: eclipse-mosquitto:latest
    profiles: ["mosquitto"]
    restart: unless-stopped
    volumes:
      - mosquitto-config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - iot

  # -------------------- NODE-RED --------------------
  nodered:
    image: nodered/node-red:latest
    profiles: ["nodered"]
    restart: unless-stopped
    # network_mode: host (NU networks: [iot]) - necesar pentru KNX/IP prin
    # multicast (224.0.23.12:3671, vezi node-red-contrib-knx-ultimate).
    # Multicast nu trece fiabil printr-o retea Docker bridge normala.
    #
    # Motivul istoric al alegerii asta in loc de macvlan: reComputer initial
    # era pe WiFi (wlan0), unde macvlan de regula NU functioneaza (driverele
    # resping frame-uri cu alt MAC decat cel al statiei asociate la AP) -
    # verificat empiric: multicast real (KNX_ROUTING_INDICATION) nu ajungea
    # deloc pe wlan0, desi conexiunea KNX raporta "connected". reComputer
    # a fost mutat de atunci pe Ethernet (eth0, IP static 192.168.21.195,
    # WiFi complet oprit) - pe cablu multicast-ul functioneaza normal, deci
    # macvlan ar fi acum o varianta viabila. Am pastrat totusi host networking:
    # deja verificat functional, si schimbarea nu ar aduce niciun beneficiu
    # real acum (izolarea de retea suplimentara pe care ar oferi-o macvlan
    # nu e o cerinta aici).
    #
    # Implicatii de retinut:
    #  - NU se mai poate combina cu "networks:" (Compose nu permite ambele pe
    #    acelasi serviciu) - Node-RED nu mai e pe reteaua "iot", deci Traefik
    #    nu-l mai gaseste dupa nume de container. Vezi traefik/routes.tmpl.yml,
    #    ruta "nodered" a fost schimbata sa tinteasca host.docker.internal.
    #  - Portul 1880 e acum legat DIRECT pe gazda (nu prin publicare Compose,
    #    care oricum nu se poate folosi cu network_mode: host) - verifica
    #    inainte ca portul sa fie liber pe orice masina pe care redeployezi.
    #  - /etc/hosts ramane totusi per-container (doar spatiul de retea e
    #    comun cu gazda, nu tot filesystem-ul), deci extra_hosts de mai jos
    #    tot e necesar.
    network_mode: host
    environment:
      - NODERED_AUTH_USER=${NODERED_AUTH_USER:-admin}
      - NODERED_AUTH_PASS=${NODERED_AUTH_PASS:-}
      # Folosite in flow-uri (function nodes) prin env.get("QLEAP_BASE_URL")
      # etc - acelasi API extern ca pe clusterul Swarm (bmsn.quartzmatrix.ro).
      - QLEAP_BASE_URL=${QLEAP_BASE_URL:-https://bmsn.quartzmatrix.ro:8085}
      - QLEAP_USER=${QLEAP_USER:-}
      - QLEAP_PASS=${QLEAP_PASS:-}
    volumes:
      - nodered-data:/data
      # Genereaza automat hash-ul bcrypt din NODERED_AUTH_USER/PASS la fiecare
      # pornire (vezi nodered/settings.js) - NODERED_AUTH_PASS gol = fara login.
      - ./nodered/settings.js:/data/settings.js:ro
    extra_hosts:
      - "bmsn.quartzmatrix.ro:192.168.6.100"
      # 127.0.0.1, NU host-gateway/host.docker.internal: in network_mode host
      # containerul E gazda din perspectiva de retea, deci porturile publicate
      # de alte containere (predict:8002, bms-floor:4173) sunt direct pe loopback.
      - "predict.test-bench.iotstack:127.0.0.1"
      - "bms-floor.test-bench.iotstack:127.0.0.1"

  # -------------------- ZIGBEE2MQTT --------------------
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    profiles: ["zigbee2mqtt"]
    restart: unless-stopped
    environment:
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=tcp://${ZIGBEE_HOST}:${ZIGBEE_PORT}
      - ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER=${ZIGBEE_ADAPTER:-zstack}
    volumes:
      - zigbee2mqtt-data:/app/data
    networks:
      - iot

  # -------------------- CHIRPSTACK (LoRaWAN) --------------------
  chirpstack-postgres:
    image: postgres:16-alpine
    profiles: ["chirpstack"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${CHIRPSTACK_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${CHIRPSTACK_POSTGRES_PASS}"
      POSTGRES_DB: chirpstack
    volumes:
      - chirpstack-postgres-data:/var/lib/postgresql/data
      # Ruleaza o singura data, cand volumul de date e gol - creeaza
      # extensiile pg_trgm/hstore fara de care migratiile ChirpStack esueaza
      # silentios (vezi comentariul din fisierul .sql).
      - ./chirpstack/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - iot

  chirpstack-redis:
    image: redis:7-alpine
    profiles: ["chirpstack"]
    restart: unless-stopped
    volumes:
      - chirpstack-redis-data:/data
    networks:
      - iot

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    profiles: ["chirpstack"]
    restart: unless-stopped
    volumes:
      - chirpstack-gwbridge-config:/etc/chirpstack-gateway-bridge
    ports:
      - "1700:1700/udp"
    networks:
      - iot

  # ATENTIE: chirpstack.toml are user/parola Postgres si secretul API scrise
  # direct (nu preiau ${CHIRPSTACK_POSTGRES_*} din .env) - daca schimbi
  # parola in .env, editeaza-o si in chirpstack/chirpstack.toml (linia dsn=).
  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: ["chirpstack"]
    restart: unless-stopped
    command: ["--config", "/etc/chirpstack"]
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - chirpstack-gateway-bridge
    volumes:
      - chirpstack-config:/etc/chirpstack
      - ./chirpstack/chirpstack.toml:/etc/chirpstack/chirpstack.toml:ro
      - ./chirpstack/region_eu868.toml:/etc/chirpstack/region_eu868.toml:ro
    networks:
      - iot

  # -------------------- TRAEFIK (reverse proxy) --------------------
  # FARA profil - porneste mereu.
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    # Necesar ca Traefik (in container) sa poata ruta catre servicii pornite
    # direct pe host (nu in alt container).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Randeaza traefik/routes.tmpl.yml -> /etc/traefik/dynamic/routes.yml
    # (inlocuieste __CLUSTER_DOMAIN__ cu valoarea reala), apoi preda
    # controlul entrypoint-ului original al imaginii - vezi entrypoint.sh.
    entrypoint: ["/bin/sh", "/etc/traefik-init/entrypoint.sh"]
    environment:
      - CLUSTER_DOMAIN=${CLUSTER_DOMAIN:-test-bench.iotstack}
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:${TRAEFIK_HTTP_PORT:-9080}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_PORT:-9443}
      - --api.dashboard=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-9080}:${TRAEFIK_HTTP_PORT:-9080}"
      - "${TRAEFIK_HTTPS_PORT:-9443}:${TRAEFIK_HTTPS_PORT:-9443}"
    volumes:
      - traefik-certs:/etc/traefik/certs:ro
      # FARA :ro pe volumul parinte: fisierele scrise/montate direct in acest
      # director (auth.yml generat de setup-traefik-auth.sh, routes.yml
      # randat la pornire, tls-options.yml, coolify.yml) au nevoie ca
      # directorul parinte sa permita crearea punctelor de montare/scriere -
      # un parinte :ro blocheaza asta.
      - traefik-dynamic:/etc/traefik/dynamic
      # Forteaza HTTP/1.1 (fara h2) - cu h2 activat (implicit), WebSocket-ul
      # editorului Node-RED (/comms) pierde conexiunea la ~1s dupa login prin
      # acest proxy, desi merge perfect fara Traefik la mijloc - verificat
      # empiric. Vezi traefik/tls-options.yml pentru detalii.
      - ./traefik/tls-options.yml:/etc/traefik/dynamic/tls-options.yml:ro
      # Ruta catre Coolify-ul OFICIAL (instalare separata, port de host 8000) -
      # provider-ul "file" NU scaneaza subfoldere, de-asta e montat DIRECT in
      # /etc/traefik/dynamic/, ca tls-options.yml de mai sus.
      - ./traefik/coolify.yml:/etc/traefik/dynamic/coolify.yml:ro
      # Template-ul si scriptul de randare - montate in afara /etc/traefik/dynamic
      # ca provider-ul file (care scaneaza tot din acel director) sa nu incerce
      # sa le parseze ca fisiere de configurare.
      - ./traefik/routes.tmpl.yml:/etc/traefik-init/routes.tmpl.yml:ro
      - ./traefik/entrypoint.sh:/etc/traefik-init/entrypoint.sh:ro
    networks:
      - iot
